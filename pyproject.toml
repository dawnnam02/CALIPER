[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caliper-design"
version = "0.3.0"
description = "Diagnostics for de novo protein binder design campaigns: catch a confidence score that points the wrong way"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kim Hyonam"}]
keywords = ["protein-design", "calibration", "multi-fidelity", "binder"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "pandas>=2.0",     # every real-data experiment reads a CSV with it
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
caliper-audit = "caliper.cli:main"

[project.urls]
Source = "https://github.com/dawnnam02/CALIPER"

[tool.setuptools.packages.find]
include = ["caliper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
